<header class="app-header">
  <mat-toolbar class="toolbar">
    <a class="brand" routerLink="/heroes" aria-label="Hero Registry, go to the hero list">
      <span class="brand-badge" aria-hidden="true">
        <mat-icon>bolt</mat-icon>
      </span>
      <span class="brand-name">Hero Registry</span>
    </a>

    <span class="spacer"></span>

    <button
      mat-icon-button
      type="button"
      data-testid="theme-toggle"
      [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [matTooltip]="isDark() ? 'Light theme' : 'Dark theme'"
      (click)="toggleTheme()"
    >
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </mat-toolbar>

  <div class="loading-slot">
    @if (isLoading()) {
      <mat-progress-bar mode="indeterminate" aria-label="Loading" data-testid="loading" />
    }
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
