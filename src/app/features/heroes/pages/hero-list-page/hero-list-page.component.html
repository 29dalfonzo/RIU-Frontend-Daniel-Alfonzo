<section class="page">
  <header class="page-header">
    <h1>Super heroes</h1>
    <button mat-flat-button type="button" data-testid="add-hero" (click)="onAdd()">
      <mat-icon>add</mat-icon>
      Add hero
    </button>
  </header>

  <app-hero-search [term]="term()" (termChange)="onTermChange($event)" />

  @if (sortedHeroes(); as heroes) {
    <app-hero-table
      [heroes]="heroes"
      [pageIndex]="pageIndex()"
      [pageSize]="size()"
      [pageSizeOptions]="pageSizeOptions"
      [sort]="sort()"
      (pageChange)="onPage($event)"
      (sortChange)="onSort($event)"
      (edit)="onEdit($event)"
      (remove)="onRemove($event)"
    />
  }
</section>
